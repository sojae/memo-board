<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메모 게시판 · API 테스트</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #6ea8fe;
    --green: #5ec97a;
    --red: #ef6a6a;
    --yellow: #e3b341;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    font-size: 14px; line-height: 1.6;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; }
  header { margin-bottom: 28px; display: flex; justify-content: space-between; align-items: flex-start; }
  .header-left h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px;
  }
  .card h2 { font-size: 14px; margin: 0 0 14px; color: var(--muted); font-weight: 600; letter-spacing: 0.02em; }

  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  input, textarea, select {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); padding: 9px 11px;
    font-family: inherit; font-size: 13px; margin-bottom: 12px;
  }
  select { cursor: pointer; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 84px; }

  button {
    background: var(--accent); color: #0f1115; border: none;
    border-radius: 6px; padding: 9px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: 500; }
  button.ghost:hover { color: var(--text); border-color: var(--muted); }
  button.danger { background: transparent; color: var(--red); border: 1px solid var(--border); font-weight: 500; }
  button.sm { padding: 5px 10px; font-size: 12px; }
  .row { display: flex; gap: 8px; }

  .filter-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-bar input { margin-bottom: 0; flex: 1; min-width: 120px; }
  .filter-bar select { margin-bottom: 0; width: auto; min-width: 110px; flex: 0 0 auto; }

  .memo {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 10px; background: var(--panel-2);
    cursor: pointer; transition: border-color 0.15s;
  }
  .memo:hover { border-color: var(--accent); }
  .memo-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .memo-title { font-weight: 600; font-size: 15px; color: var(--accent); }
  .memo-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .memo-preview { margin-top: 6px; color: #9ca3af; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .pager { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 16px; color: var(--muted); font-size: 12px; }

  .empty { color: var(--muted); text-align: center; padding: 36px 0; }
  .err { color: var(--red); font-size: 12px; margin: -6px 0 12px; min-height: 16px; }

  /* 인증 영역 */
  .auth-bar {
    display: flex; gap: 8px; align-items: center;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px;
  }
  .auth-bar input { margin-bottom: 0; width: 140px; }
  .auth-bar .err { margin: 0; min-height: auto; }
  .user-info { color: var(--green); font-weight: 600; font-size: 13px; }
  .auth-bar button.logout { background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: 500; font-size: 12px; padding: 6px 12px; }

  /* 상세 페이지 */
  .detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .detail-title { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
  .detail-meta { color: var(--muted); font-size: 13px; }
  .detail-content { white-space: pre-wrap; line-height: 1.8; margin: 20px 0; padding: 16px; background: var(--panel-2); border-radius: 8px; border: 1px solid var(--border); min-height: 100px; }
  .detail-actions { display: flex; gap: 8px; margin-top: 16px; }

  /* 등록/수정 폼 */
  .form-page textarea { min-height: 160px; }

  /* 뷰 전환 */
  .view { display: none; }
  .view.active { display: block; }

  /* 툴바 */
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }

  /* 요청 로그 패널 */
  #log { margin-top: 20px; }
  .log-line {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    padding: 6px 0; border-bottom: 1px solid var(--border); color: var(--muted);
  }
  .log-line:last-child { border-bottom: none; }
  .m { font-weight: 700; margin-right: 8px; }
  .m-GET { color: var(--accent); } .m-POST { color: var(--green); }
  .m-PUT { color: var(--yellow); } .m-DELETE { color: var(--red); }
  .st-ok { color: var(--green); } .st-err { color: var(--red); }

  .back-link { color: var(--muted); cursor: pointer; font-size: 13px; }
  .back-link:hover { color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-left">
      <h1>메모 게시판</h1>
      <div class="sub">Spring Boot REST API 동작 확인용 페이지 · JWT 인증 기반</div>
    </div>

    <!-- 로그인/회원가입 or 사용자 정보 -->
    <div class="auth-bar" id="authBar">
      <div id="authForm">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <input id="authUsername" placeholder="사용자명" maxlength="30">
          <input id="authPassword" type="password" placeholder="비밀번호" maxlength="100">
          <button class="sm" id="loginBtn">로그인</button>
          <button class="ghost sm" id="signupBtn">회원가입</button>
        </div>
        <div class="err" id="authError"></div>
      </div>
      <div id="userInfo" style="display:none;">
        <div style="display:flex;gap:8px;align-items:center;">
          <span class="user-info" id="currentUser"></span>
          <button class="logout sm" id="logoutBtn">로그아웃</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== 리스트 뷰 ===== -->
  <div class="view active" id="listView">
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0;">메모 목록</h2>
        <button class="sm" id="newMemoBtn" style="display:none;">새 메모 작성</button>
      </div>
      <div class="filter-bar">
        <input id="keyword" placeholder="제목으로 검색">
        <select id="authorFilter">
          <option value="">전체 작성자</option>
        </select>
        <button class="ghost sm" id="searchBtn">검색</button>
        <button class="ghost sm" id="resetBtn">초기화</button>
      </div>
      <div id="list"></div>
      <div class="pager">
        <button class="ghost sm" id="prevBtn">이전</button>
        <span id="pageInfo">-</span>
        <button class="ghost sm" id="nextBtn">다음</button>
      </div>
    </div>
  </div>

  <!-- ===== 상세 뷰 ===== -->
  <div class="view" id="detailView">
    <div class="card">
      <span class="back-link" id="detailBack">← 목록으로</span>
      <div style="margin-top:14px;">
        <div class="detail-header">
          <div>
            <h2 class="detail-title" id="detailTitle"></h2>
            <div class="detail-meta" id="detailMeta"></div>
          </div>
          <div class="detail-actions" id="detailActions"></div>
        </div>
        <div class="detail-content" id="detailContent"></div>
      </div>
    </div>
  </div>

  <!-- ===== 등록/수정 뷰 ===== -->
  <div class="view" id="formView">
    <div class="card form-page">
      <span class="back-link" id="formBack">← 목록으로</span>
      <h2 id="formTitle" style="margin-top:14px;">새 메모 작성</h2>
      <input type="hidden" id="editingId">

      <label for="title">제목</label>
      <input id="title" placeholder="제목을 입력하세요" maxlength="100">

      <label for="content">내용</label>
      <textarea id="content" placeholder="내용을 입력하세요" maxlength="2000"></textarea>

      <div class="err" id="formError"></div>

      <div class="row">
        <button id="submitBtn">저장</button>
        <button class="ghost" id="cancelBtn">취소</button>
      </div>
    </div>
  </div>

  <div class="card" id="log">
    <h2>요청 기록</h2>
    <div id="logBody"><div class="log-line">아직 요청이 없습니다.</div></div>
  </div>
</div>

<script>
const API = '/api/memos';
const AUTH_API = '/api/auth';
const PAGE_SIZE = 5;
let totalPages = 1;

const $ = (id) => document.getElementById(id);

// --- 뷰 전환 ---
function showView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $(viewId).classList.add('active');
}

function goToList() {
  showView('listView');
  location.hash = '';
}

function goToDetail(id) {
  showView('detailView');
  location.hash = `detail/${id}`;
  loadDetail(id);
}

function goToForm(editId) {
  resetForm();
  if (editId) {
    loadForEdit(editId);
    location.hash = `edit/${editId}`;
  } else {
    location.hash = 'create';
  }
  showView('formView');
}

// --- URL 파라미터 ---
function getUrlParams() {
  const p = new URLSearchParams(location.search);
  return {
    page: Math.max(0, parseInt(p.get('page') ?? '0', 10) || 0),
    keyword: p.get('keyword') ?? '',
    author: p.get('author') ?? ''
  };
}

function pushPageState(page, keyword, author) {
  const p = new URLSearchParams();
  if (page > 0) p.set('page', page);
  if (keyword) p.set('keyword', keyword);
  if (author) p.set('author', author);
  const qs = p.toString();
  const hash = location.hash;
  history.pushState(null, '', (qs ? `?${qs}` : location.pathname) + hash);
}

let { page: currentPage, keyword: currentKeyword, author: currentAuthor } = getUrlParams();

// --- 인증 상태 관리 ---
function getToken() { return localStorage.getItem('jwt_token'); }
function getUsername() { return localStorage.getItem('jwt_username'); }

function setAuth(token, username) {
  localStorage.setItem('jwt_token', token);
  localStorage.setItem('jwt_username', username);
  updateAuthUI();
}

function clearAuth() {
  localStorage.removeItem('jwt_token');
  localStorage.removeItem('jwt_username');
  updateAuthUI();
}

function updateAuthUI() {
  const loggedIn = !!getToken();
  $('authForm').style.display = loggedIn ? 'none' : 'block';
  $('userInfo').style.display = loggedIn ? 'block' : 'none';
  $('newMemoBtn').style.display = loggedIn ? 'inline-block' : 'none';
  if (loggedIn) {
    $('currentUser').textContent = getUsername() + ' 님';
  }
  loadList();
}

// --- API 호출 헬퍼 ---
async function api(method, url, body) {
  const options = { method, headers: { 'Content-Type': 'application/json' } };
  const token = getToken();
  if (token) {
    options.headers['Authorization'] = 'Bearer ' + token;
  }
  if (body) options.body = JSON.stringify(body);

  const res = await fetch(url, options);
  addLog(method, url, res.status);

  if (res.status === 401 || res.status === 403) {
    const data = await res.json().catch(() => null);
    if (res.status === 401 && getToken()) {
      clearAuth();
    }
    throw { status: res.status, data };
  }

  if (res.status === 204) return null;
  const data = await res.json().catch(() => null);
  if (!res.ok) throw { status: res.status, data };
  return data;
}

function addLog(method, url, status) {
  const body = $('logBody');
  if (body.dataset.empty !== 'no') { body.innerHTML = ''; body.dataset.empty = 'no'; }
  const line = document.createElement('div');
  line.className = 'log-line';
  const cls = status >= 200 && status < 300 ? 'st-ok' : 'st-err';
  line.innerHTML = `<span class="m m-${method}">${method}</span>${escapeHtml(url)} <span class="${cls}">→ ${status}</span>`;
  body.prepend(line);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// --- 작성자 목록 로드 ---
async function loadAuthors() {
  try {
    const data = await api('GET', `${API}?size=100`);
    const authors = [...new Set(data.content.map(m => m.author))].sort();
    const select = $('authorFilter');
    select.innerHTML = '<option value="">전체 작성자</option>';
    authors.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a;
      opt.textContent = a;
      if (a === currentAuthor) opt.selected = true;
      select.appendChild(opt);
    });
  } catch (e) { /* ignore */ }
}

// --- 인증 기능 ---
async function doLogin() {
  const username = $('authUsername').value.trim();
  const password = $('authPassword').value.trim();
  $('authError').textContent = '';
  if (!username || !password) { $('authError').textContent = '사용자명과 비밀번호를 입력하세요.'; return; }

  try {
    const data = await api('POST', `${AUTH_API}/login`, { username, password });
    setAuth(data.token, data.username);
    $('authUsername').value = '';
    $('authPassword').value = '';
  } catch (e) {
    $('authError').textContent = e.data?.message ?? '로그인에 실패했습니다.';
  }
}

async function doSignup() {
  const username = $('authUsername').value.trim();
  const password = $('authPassword').value.trim();
  $('authError').textContent = '';
  if (!username || !password) { $('authError').textContent = '사용자명과 비밀번호를 입력하세요.'; return; }

  try {
    const data = await api('POST', `${AUTH_API}/signup`, { username, password });
    setAuth(data.token, data.username);
    $('authUsername').value = '';
    $('authPassword').value = '';
  } catch (e) {
    const fe = e.data?.fieldErrors;
    $('authError').textContent = fe && Object.keys(fe).length
      ? Object.values(fe).join(' / ')
      : (e.data?.message ?? '회원가입에 실패했습니다.');
  }
}

// --- 메모 목록 ---
async function loadList(updateUrl = true) {
  const params = new URLSearchParams({ page: currentPage, size: PAGE_SIZE });
  if (currentKeyword) params.set('keyword', currentKeyword);
  if (currentAuthor) params.set('author', currentAuthor);

  if (updateUrl) pushPageState(currentPage, currentKeyword, currentAuthor);

  try {
    const data = await api('GET', `${API}?${params}`);
    totalPages = Math.max(data.totalPages, 1);
    renderList(data.content);
    $('pageInfo').textContent = `${data.page + 1} / ${totalPages} 페이지 · 전체 ${data.totalElements}건`;
    $('prevBtn').disabled = data.page === 0;
    $('nextBtn').disabled = data.last;
  } catch (e) {
    $('list').innerHTML = `<div class="empty">목록을 불러오지 못했습니다. 서버가 켜져 있는지 확인하세요.</div>`;
  }
}

function renderList(memos) {
  const list = $('list');
  if (!memos.length) {
    list.innerHTML = `<div class="empty">메모가 없습니다.</div>`;
    return;
  }
  list.innerHTML = memos.map(m => {
    const preview = m.content.length > 60 ? m.content.substring(0, 60) + '...' : m.content;
    return `
      <div class="memo" onclick="goToDetail(${m.id})">
        <div class="memo-top">
          <div>
            <div class="memo-title">${escapeHtml(m.title)}</div>
            <div class="memo-meta">#${m.id} · ${escapeHtml(m.author)} · ${formatDate(m.createdAt)}</div>
          </div>
        </div>
        <div class="memo-preview">${escapeHtml(preview)}</div>
      </div>`;
  }).join('');
}

// --- 메모 상세 ---
async function loadDetail(id) {
  try {
    const m = await api('GET', `${API}/${id}`);
    $('detailTitle').textContent = m.title;
    $('detailMeta').textContent = `#${m.id} · ${m.author} · 작성 ${formatDate(m.createdAt)}` +
      (m.updatedAt && m.updatedAt !== m.createdAt ? ` · 수정 ${formatDate(m.updatedAt)}` : '');
    $('detailContent').textContent = m.content;

    const loggedInUser = getUsername();
    const isOwner = loggedInUser && m.author === loggedInUser;
    $('detailActions').innerHTML = isOwner
      ? `<button class="ghost sm" onclick="goToForm(${m.id})">수정</button>
         <button class="danger sm" onclick="removeMemo(${m.id})">삭제</button>`
      : '';
  } catch (e) {
    $('detailTitle').textContent = '메모를 찾을 수 없습니다';
    $('detailMeta').textContent = '';
    $('detailContent').textContent = '';
    $('detailActions').innerHTML = '';
  }
}

// --- 메모 등록/수정 ---
async function loadForEdit(id) {
  try {
    const m = await api('GET', `${API}/${id}`);
    $('editingId').value = m.id;
    $('title').value = m.title;
    $('content').value = m.content;
    $('formTitle').textContent = `메모 수정 (#${m.id})`;
    $('submitBtn').textContent = '수정 저장';
  } catch (e) {
    alert('메모를 불러오지 못했습니다.');
    goToList();
  }
}

async function submitForm() {
  const id = $('editingId').value;
  const title = $('title').value.trim();
  const content = $('content').value.trim();
  $('formError').textContent = '';

  try {
    if (id) {
      await api('PUT', `${API}/${id}`, { title, content });
    } else {
      await api('POST', API, { title, content });
    }
    currentPage = 0;
    goToList();
    loadList();
  } catch (e) {
    if (e.status === 403) {
      $('formError').textContent = e.data?.message ?? '본인의 메모만 수정할 수 있습니다.';
      return;
    }
    const fe = e.data?.fieldErrors;
    $('formError').textContent = fe && Object.keys(fe).length
      ? Object.values(fe).join(' / ')
      : (e.data?.message ?? '저장에 실패했습니다.');
  }
}

async function removeMemo(id) {
  if (!confirm(`#${id} 메모를 삭제할까요?`)) return;
  try {
    await api('DELETE', `${API}/${id}`);
    goToList();
    loadList();
  } catch (e) {
    if (e.status === 403) {
      alert(e.data?.message ?? '본인의 메모만 삭제할 수 있습니다.');
      return;
    }
    alert('삭제에 실패했습니다.');
  }
}

function resetForm() {
  $('editingId').value = '';
  $('title').value = '';
  $('content').value = '';
  $('formError').textContent = '';
  $('formTitle').textContent = '새 메모 작성';
  $('submitBtn').textContent = '저장';
}

// --- 해시 라우팅 ---
function handleHash() {
  const hash = location.hash.replace('#', '');
  if (hash.startsWith('detail/')) {
    const id = parseInt(hash.split('/')[1], 10);
    if (id) { showView('detailView'); loadDetail(id); return; }
  } else if (hash.startsWith('edit/')) {
    const id = parseInt(hash.split('/')[1], 10);
    if (id) { goToForm(id); return; }
  } else if (hash === 'create') {
    showView('formView');
    resetForm();
    return;
  }
  showView('listView');
}

// --- 이벤트 연결 ---
$('loginBtn').onclick = doLogin;
$('signupBtn').onclick = doSignup;
$('logoutBtn').onclick = () => { clearAuth(); goToList(); };
$('authPassword').onkeydown = (e) => { if (e.key === 'Enter') doLogin(); };

$('newMemoBtn').onclick = () => goToForm();
$('submitBtn').onclick = submitForm;
$('cancelBtn').onclick = () => goToList();
$('formBack').onclick = () => goToList();
$('detailBack').onclick = () => goToList();

$('searchBtn').onclick = () => {
  currentKeyword = $('keyword').value.trim();
  currentAuthor = $('authorFilter').value;
  currentPage = 0;
  loadList();
};
$('resetBtn').onclick = () => {
  $('keyword').value = '';
  $('authorFilter').value = '';
  currentKeyword = '';
  currentAuthor = '';
  currentPage = 0;
  loadList();
};
$('keyword').onkeydown = (e) => { if (e.key === 'Enter') $('searchBtn').click(); };
$('authorFilter').onchange = () => {
  currentAuthor = $('authorFilter').value;
  currentPage = 0;
  loadList();
};
$('prevBtn').onclick = () => { if (currentPage > 0) { currentPage--; loadList(); } };
$('nextBtn').onclick = () => { if (currentPage < totalPages - 1) { currentPage++; loadList(); } };

window.goToDetail = goToDetail;
window.goToForm = goToForm;
window.removeMemo = removeMemo;

window.onhashchange = handleHash;
window.onpopstate = () => {
  const s = getUrlParams();
  currentPage = s.page;
  currentKeyword = s.keyword;
  currentAuthor = s.author;
  $('keyword').value = currentKeyword;
  $('authorFilter').value = currentAuthor;
  loadList(false);
};

// 초기화
$('keyword').value = currentKeyword;
updateAuthUI();
loadAuthors();
handleHash();
</script>
