# ============================================================
# 애플리케이션 설정 파일 (.env + 서버 설정 을 합친 느낌)
# ============================================================

server:
  port: 8080          # 서버가 뜰 포트. http://localhost:8080

spring:
  application:
    name: memo-board

  # ---------- 데이터베이스 (MySQL) ----------
  datasource:
    url: jdbc:mysql://localhost:3306/memo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234

  # ---------- JPA / Hibernate ----------
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# ---------- JWT ----------
jwt:
  # 토큰 서명에 쓰이는 비밀키. 실무에서는 환경 변수로 관리해야 합니다.
  secret: memo-board-secret-key-for-jwt-must-be-at-least-256-bits-long-enough
  # 토큰 유효 시간 (밀리초). 3600000 = 1시간
  expiration: 3600000

logging:
  level:
    # SQL 에 들어가는 실제 파라미터 값까지 보고 싶을 때
    org.hibernate.orm.jdbc.bind: trace
